# WurmModLoader — HTTP server subsystem configuration
#
# Drop this file at `<server-root>/config/wurmmodloader-http.properties`
# (same dir as vanilla Wurm's `logging.properties`). Missing file = defaults; the
# subsystem never fails boot on a missing or malformed config.
# `./deploy.sh` will seed this file there on first run — subsequent deploys won't
# overwrite your edits.
#
# Loaded by: com.garward.wurmmodloader.httpserver.HttpServerConfig
# Consumed by: ModHttpServerImpl / PackServer — serves mod graphics packs over HTTP.

# Port to bind on. 0 = pick an ephemeral port at boot time.
# Historical default for the legacy httpserver mod was port-of-choice; 0 is safer
# because it guarantees no BindException on fast restart (TIME_WAIT socket reuse).
serverPort=0

# Hostname that appears in URLs handed to clients (e.g. the livemap tile URL).
# Leave blank to use the server's bind host. Set this to your LAN IP or public DNS
# name if clients live on a different machine.
# publicServerAddress=192.168.0.113

# Port that appears in URLs. 0 = use whatever port we actually bound (recommended
# when serverPort=0). Only set this if you run behind a reverse proxy on a
# different public port.
publicServerPort=0

# Network interface to bind to. Leave blank to bind the server's external IP.
# Set to 0.0.0.0 to bind all interfaces, or a specific IP to restrict.
# internalServerAddress=0.0.0.0

# Max concurrent HTTP worker threads. 50 is plenty for a small-to-mid server;
# bump for hundreds of simultaneous pack downloads on first-join waves.
maxThreads=50

# If true and serverPort fails to bind after retries, fall back to an ephemeral
# port. Safe because consumers fetch the real URL via the httpserver:get_uri
# ModQueryEvent — they never hardcode the port.
allowEphemeralPort=true
